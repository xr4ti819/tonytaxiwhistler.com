# Netlify build configuration for Tony Taxi Whistler frontend
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Run the React build from the frontend directory
  base = "frontend/"
  command = "yarn install --frozen-lockfile && yarn build"
  publish = "build/"

[build.environment]
  NODE_VERSION = "20"
  YARN_VERSION = "1.22.22"
  # Disable Netlify's source map upload (faster builds, smaller artifacts)
  GENERATE_SOURCEMAP = "false"
  # CRA hard-fails the build when ESLint emits warnings — let warnings through
  CI = "false"

# SPA routing — every unknown route serves index.html so React Router takes over
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache static assets aggressively (immutable, hashed filenames from CRA)
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Don't cache index.html — always fetch fresh so users see new deploys instantly
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# robots.txt + sitemap.xml — served by Netlify edge
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type  = "text/plain; charset=utf-8"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type  = "application/xml; charset=utf-8"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options       = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy       = "strict-origin-when-cross-origin"
    Permissions-Policy    = "geolocation=(), microphone=(), camera=()"
